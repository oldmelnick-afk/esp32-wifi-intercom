; Default builds: no BLE, Wi-Fi power saving off, unicast voice to known boxes.
[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=2

[env:screenless]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DHOUSE_LCD1602_DIRECT=0

; Previous behaviour with the NimBLE timer. BLE keeps Wi-Fi in modem sleep,
; so voice may stutter again; use only for comparison.
[env:esp32dev_ble]
extends = env:esp32dev
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DHOUSE_ENABLE_BLE=1

[env:screenless_ble]
extends = env:esp32dev
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DHOUSE_LCD1602_DIRECT=0
    -DHOUSE_ENABLE_BLE=1
