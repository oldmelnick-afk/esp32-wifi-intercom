<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
 <defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.head{font-size:29px;font-weight:bold}.small{font-size:17px}.label{font-size:22px;font-weight:bold}.box{fill:#f3f8fc;stroke:#26577c;stroke-width:2;rx:13}.wifi{stroke:#138b80;stroke-width:3;fill:none;stroke-dasharray:7 7}.bt{stroke:#7354a1;stroke-width:3;fill:none}</style></defs>
 <rect width="1100" height="600" fill="white"/>
 <text x="40" y="48" class="head">Связь на пять комнат</text>
 <text x="40" y="77" class="small">Каждая точка питается от своей розетки 5 В. Wi‑Fi переносит звук между точками.</text>
 <text x="40" y="104" class="small">Большая кнопка — всем; четыре маленькие — по одной выбранной комнате.</text>
 <rect class="box" x="427" y="205" width="250" height="104"/>
 <text x="484" y="246" class="label">Домашний Wi‑Fi</text><text x="460" y="278" class="small">одна локальная сеть</text>
