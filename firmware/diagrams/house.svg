 <g class="small"><text x="81" y="205">5 кнопок · динамик · BLE</text><text x="81" y="426">5 кнопок · динамик · BLE</text><text x="850" y="174">5 кнопок · динамик · BLE</text><text x="850" y="322">5 кнопок · динамик · BLE</text><text x="850" y="470">5 кнопок · динамик · BLE</text></g>
