<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790">
 <defs><style>
 text{font-family:Arial,sans-serif;fill:#17324d} .title{font-size:28px;font-weight:bold}
 .sub{font-size:17px} .label{font-size:20px;font-weight:bold} .small{font-size:16px}
 .box{fill:#f3f8fc;stroke:#26577c;stroke-width:2;rx:14} .power{stroke:#e45d28;stroke-width:4;fill:none}
 .ground{stroke:#4c6470;stroke-width:3;fill:none} .signal{stroke:#138b80;stroke-width:3;fill:none}
 .speaker{stroke:#7156aa;stroke-width:4;fill:none} .note{fill:#fff8e8;stroke:#d4a846;stroke-width:1.5;rx:9}
 </style></defs>
 <rect width="1200" height="790" fill="white"/>
 <text x="38" y="47" class="title">Одна переговорная точка — собрать 5 одинаковых</text>
 <text x="38" y="77" class="sub">Питание только от розетки: блок 5 В → разъём DC → ESP32 и усилитель. Все земли объединены.</text>

 <rect class="box" x="38" y="123" width="178" height="100"/>
 <text x="56" y="160" class="label">Блок питания</text><text x="56" y="190" class="sub">5 В, плюс в центре</text>
 <rect class="box" x="284" y="123" width="175" height="100"/>
 <text x="304" y="160" class="label">Гнездо DC</text><text x="304" y="190" class="sub">5,5 × 2,1 мм</text>
 <rect class="box" x="537" y="118" width="268" height="474"/>
 <text x="583" y="153" class="label">ESP32 DevKit</text>
 <text x="556" y="191" class="small">5V / VIN ← 5 В</text>
 <text x="556" y="222" class="small">GND ← общий минус</text>
 <text x="556" y="253" class="small">3V3 → микрофон</text>
 <text x="556" y="299" class="small">GPIO14 → MIC BCLK</text>
 <text x="556" y="329" class="small">GPIO27 → MIC LRCL</text>
 <text x="556" y="359" class="small">GPIO34 ← MIC DOUT</text>
 <text x="556" y="405" class="small">GPIO26 → AMP BCLK</text>
 <text x="556" y="435" class="small">GPIO25 → AMP LRC</text>
 <text x="556" y="465" class="small">GPIO22 → AMP DIN</text>
 <text x="556" y="511" class="small">GPIO32 ← кнопка PTT</text>
 <text x="556" y="551" class="small">GPIO18 / 19 / 21 / 33</text>
 <text x="556" y="576" class="small">← 4 кнопки комнат</text>
 <rect class="box" x="38" y="271" width="386" height="94"/>
 <text x="57" y="308" class="label">Красный индикатор</text>
 <text x="57" y="339" class="small">GPIO2 → 330 Ом → LED (+); (−) → GND</text>
 <rect class="box" x="893" y="119" width="266" height="170"/>
 <text x="931" y="154" class="label">ICS-43434</text>
 <text x="911" y="190" class="small">3V: 3,3 В; GND: минус</text>
 <text x="911" y="222" class="small">BCLK / LRCL / DOUT: I²S</text>
 <text x="911" y="254" class="small">SEL → GND (левый канал)</text>
 <rect class="box" x="894" y="341" width="263" height="141"/>
 <text x="927" y="378" class="label">MAX98357A</text>
 <text x="910" y="410" class="small">VIN: 5 В; GND: минус</text>
 <text x="910" y="442" class="small">BCLK / LRC / DIN: I²S</text>
 <rect class="box" x="894" y="535" width="263" height="84"/>
 <text x="922" y="570" class="label">Динамик 4 Ом</text>
 <text x="915" y="597" class="small">только SPK+ и SPK−</text>
 <rect class="box" x="534" y="604" width="268" height="82"/>
 <text x="568" y="636" class="label">Большая кнопка ВСЕМ</text>
 <text x="573" y="665" class="small">GPIO32 ↔ GND</text>
 <rect class="box" x="38" y="412" width="386" height="262"/>
 <text x="57" y="447" class="label">4 маленькие кнопки</text>
 <text x="57" y="483" class="small">К1: GPIO18 ↔ GND</text>
 <text x="57" y="520" class="small">К2: GPIO19 ↔ GND</text>
 <text x="57" y="557" class="small">К3: GPIO21 ↔ GND</text>
 <text x="57" y="594" class="small">К4: GPIO33 ↔ GND</text>
 <text x="57" y="642" class="small">Кому звонит каждая — в README</text>

 <path class="power" d="M216 151 H284 M459 151 H537 M459 151 V106 H865 V374 H894"/>
 <text x="472" y="139" class="small" fill="#e45d28">+5 В</text>
 <path class="ground" d="M216 204 H284 M459 204 H537 M459 204 V722 H846 V445 H894"/>
 <text x="469" y="216" class="small">GND</text>
 <path class="signal" d="M805 248 H846 V180 H893 M805 305 H859 V213 H893 M805 351 H872 V245 H893"/>
 <path class="signal" d="M805 400 H894 M805 430 H894 M805 460 H894"/>
 <path class="speaker" d="M1028 482 V535 M1100 482 V535"/>
 <text x="993" y="515" class="small">SPK+</text><text x="1069" y="515" class="small">SPK−</text>
 <path class="signal" d="M668 592 V604"/>
 <circle cx="459" cy="560" r="7" fill="white"/>
 <path class="signal" d="M424 560 H537"/>
 <path class="ground" d="M120 674 V722 H459"/>

 <rect class="note" x="37" y="725" width="1117" height="46"/>
 <text x="56" y="754" class="small">Динамик не соединять с GND; микрофону только 3,3 В. Перед пайкой проверить полярность блока мультиметром.</text>
</svg>
