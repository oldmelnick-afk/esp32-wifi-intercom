<text x="1546" y="326" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">15</text>
<circle cx="258" cy="680" r="15" fill="#ffffff" stroke="#b45b20" stroke-width="6"/>
<text x="258" y="640" font-size="18" font-weight="700" fill="#b45b20" text-anchor="middle">VIN/5V</text>
<text x="258" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">01</text>
<circle cx="350" cy="680" r="15" fill="#ffffff" stroke="#415464" stroke-width="6"/>
<text x="350" y="640" font-size="20" font-weight="700" fill="#415464" text-anchor="middle">GND</text>
<text x="350" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">02</text>
<circle cx="442" cy="680" r="15" fill="#ffffff" stroke="#768894" stroke-width="6"/>
<text x="442" y="640" font-size="20" font-weight="700" fill="#768894" text-anchor="middle">D13</text>
<text x="442" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">03</text>
<circle cx="534" cy="680" r="15" fill="#ffffff" stroke="#768894" stroke-width="6"/>
<text x="534" y="640" font-size="20" font-weight="700" fill="#768894" text-anchor="middle">D12</text>
<text x="534" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">04</text>
<circle cx="626" cy="680" r="15" fill="#ffffff" stroke="#2374a4" stroke-width="6"/>
<text x="626" y="640" font-size="20" font-weight="700" fill="#2374a4" text-anchor="middle">D14</text>
<text x="626" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">05</text>
<circle cx="718" cy="680" r="15" fill="#ffffff" stroke="#2374a4" stroke-width="6"/>
<text x="718" y="640" font-size="20" font-weight="700" fill="#2374a4" text-anchor="middle">D27</text>
<text x="718" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">06</text>
<circle cx="810" cy="680" r="15" fill="#ffffff" stroke="#2374a4" stroke-width="6"/>
<text x="810" y="640" font-size="20" font-weight="700" fill="#2374a4" text-anchor="middle">D26</text>
<text x="810" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">07</text>
<circle cx="902" cy="680" r="15" fill="#ffffff" stroke="#2374a4" stroke-width="6"/>
<text x="902" y="640" font-size="20" font-weight="700" fill="#2374a4" text-anchor="middle">D25</text>
<text x="902" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">08</text>
<circle cx="994" cy="680" r="15" fill="#ffffff" stroke="#16804d" stroke-width="6"/>
<text x="994" y="640" font-size="20" font-weight="700" fill="#16804d" text-anchor="middle">D33</text>
<text x="994" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">09</text>
<circle cx="1086" cy="680" r="15" fill="#ffffff" stroke="#16804d" stroke-width="6"/>
<text x="1086" y="640" font-size="20" font-weight="700" fill="#16804d" text-anchor="middle">D32</text>
<text x="1086" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">10</text>
<circle cx="1178" cy="680" r="15" fill="#ffffff" stroke="#768894" stroke-width="6"/>
<text x="1178" y="640" font-size="20" font-weight="700" fill="#768894" text-anchor="middle">D35</text>
<text x="1178" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">11</text>
