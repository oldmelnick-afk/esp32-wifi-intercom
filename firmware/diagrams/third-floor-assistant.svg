<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1830" viewBox="0 0 1800 1830">
<style>text{font-family:Segoe UI,Arial,sans-serif}</style>
<rect width="1800" height="1830" fill="#f5f9fc"/>
<text x="60" y="78" font-size="43" font-weight="700" fill="#17354b" text-anchor="start">3-Й ЭТАЖ • комната 3 • 3F-A • ОТДЕЛЬНАЯ КНОПКА ИИ</text>
<text x="60" y="121" font-size="27" font-weight="400" fill="#17354b" text-anchor="start">ESP32 DevKit V1.302, 30 контактов, без экрана. Вид со стороны пайки: USB СЛЕВА.</text>
<text x="60" y="162" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">Номера верхнего и нижнего рядов считают слева направо; перед пайкой сверить надписи на своей плате.</text>
<rect x="200" y="205" width="1400" height="515" rx="24" fill="#e9f1f5" stroke="#789bb1" stroke-width="4"/>
<rect x="70" y="437" width="130" height="80" rx="10" fill="#bac7ce" stroke="#526a78" stroke-width="4"/>
<text x="78" y="427" font-size="26" font-weight="700" fill="#17354b" text-anchor="start">USB ←</text>
<text x="900" y="407" font-size="36" font-weight="700" fill="#17354b" text-anchor="middle">ESP32 V1.302 — ОБРАТНАЯ СТОРОНА</text>
<text x="900" y="453" font-size="23" font-weight="400" fill="#17354b" text-anchor="middle">верхний ряд — над платой на рисунке</text>
<text x="900" y="492" font-size="23" font-weight="400" fill="#17354b" text-anchor="middle">нижний ряд — под платой на рисунке</text>
<text x="900" y="535" font-size="21" font-weight="400" fill="#17354b" text-anchor="middle">Зелёный: кнопки  •  Синий: звук  •  Красный: ИИ  •  Коричневый: питание/LED</text>
