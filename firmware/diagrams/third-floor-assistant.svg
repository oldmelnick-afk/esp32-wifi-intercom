<circle cx="1546" cy="680" r="15" fill="#ffffff" stroke="#768894" stroke-width="6"/>
<text x="1546" y="640" font-size="20" font-weight="700" fill="#768894" text-anchor="middle">EN</text>
<text x="1546" y="610" font-size="17" font-weight="400" fill="#435566" text-anchor="middle">15</text>
<rect x="60" y="785" width="815" height="380" rx="18" fill="#ffffff" stroke="#16804d" stroke-width="3"/>
<rect x="60" y="785" width="815" height="58" rx="18" fill="#16804d"/>
<rect x="60" y="821" width="815" height="22" fill="#16804d"/>
<text x="84" y="824" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">КНОПКИ (каждая замыкает GPIO на GND)</text>
<text x="84" y="883" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">ВСЕМ  → нижний 10 D32 → большая кнопка → GND</text>
<text x="84" y="930" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">К1       → верхний 09 D18 → 1-й этаж → GND</text>
<text x="84" y="977" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">К2       → верхний 10 D19 → 2-й этаж → GND</text>
<text x="84" y="1024" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">К3       → верхний 11 D21 → 3F-B → GND</text>
<text x="84" y="1071" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">К4       → нижний 09 D33 → 4-й этаж → GND</text>
<text x="84" y="1118" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">ИИ         → верхний 07 TX2/D17 → кнопка → GND</text>
<rect x="925" y="785" width="815" height="380" rx="18" fill="#ffffff" stroke="#b45b20" stroke-width="3"/>
<rect x="925" y="785" width="815" height="58" rx="18" fill="#b45b20"/>
<rect x="925" y="821" width="815" height="22" fill="#b45b20"/>
<text x="949" y="824" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">ПИТАНИЕ И ИНДИКАТОР</text>
<text x="949" y="883" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">DC +5 В → нижний 01 VIN/5V; оттуда → AMP VIN</text>
<text x="949" y="930" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">DC минус → нижний 02 GND; все земли общие</text>
<text x="949" y="977" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">Верхний 01 3V3 → MIC 3V (только 3,3 В)</text>
<text x="949" y="1024" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">Верхний 04 D2 → резистор 220–470 Ом → LED +</text>
<text x="949" y="1071" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">LED − → общий GND; 330 Ом — удобный номинал</text>
<text x="949" y="1118" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">Внешние 5 В и USB компьютера не включать вместе</text>
<rect x="60" y="1190" width="815" height="370" rx="18" fill="#ffffff" stroke="#2374a4" stroke-width="3"/>
<rect x="60" y="1190" width="815" height="58" rx="18" fill="#2374a4"/>
<rect x="60" y="1226" width="815" height="22" fill="#2374a4"/>
<text x="84" y="1229" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">МИКРОФОН ICS-43434</text>
<text x="84" y="1288" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">SEL → GND                 3V → верхний 01 3V3</text>
<text x="84" y="1335" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">LRCL → нижний 06 D27     GND → общий GND</text>
<text x="84" y="1382" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">DOUT → нижний 12 D34</text>
<text x="84" y="1429" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">BCLK → нижний 05 D14</text>
<text x="84" y="1476" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">Акустическое отверстие не заливать клеем</text>
<rect x="925" y="1190" width="815" height="370" rx="18" fill="#ffffff" stroke="#2374a4" stroke-width="3"/>
<rect x="925" y="1190" width="815" height="58" rx="18" fill="#2374a4"/>
<rect x="925" y="1226" width="815" height="22" fill="#2374a4"/>
<text x="949" y="1229" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">УСИЛИТЕЛЬ MAX98357A + ДИНАМИК</text>
<text x="949" y="1288" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">LRC → нижний 08 D25    BCLK → нижний 07 D26</text>
<text x="949" y="1335" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">DIN → верхний 14 D22   VIN → проверенные +5 В</text>
<text x="949" y="1382" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">GND → общий GND         GAIN и SD → свободны</text>
<text x="949" y="1429" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">SPK+ / SPK− → только два вывода динамика</text>
<text x="949" y="1476" font-size="23" font-weight="400" fill="#17354b" text-anchor="start">Ни один вывод динамика НЕ вести на GND</text>
<rect x="60" y="1588" width="1680" height="195" rx="18" fill="#fff8e9" stroke="#e4b45d" stroke-width="3"/>
<text x="86" y="1633" font-size="28" font-weight="700" fill="#744d13" text-anchor="start">НАСТРОЙКА И ПРОВЕРКА</text>
<text x="86" y="1676" font-size="24" font-weight="400" fill="#17354b" text-anchor="start">Прошивка: screenless. По USB: ROOM 3 → ASSIST PIN 17 → перезапуск EN → STATUS.</text>
<text x="86" y="1717" font-size="22" font-weight="400" fill="#17354b" text-anchor="start">BUTTONS проверяет пять переговорных кнопок; ИИ проверять удержанием при работающем шлюзе помощника.</text>
<text x="86" y="1758" font-size="22" font-weight="400" fill="#17354b" text-anchor="start">Схема основана на коде 23.10.2026; физическая пайка третьей коробки ещё не проверена.</text>
</svg>